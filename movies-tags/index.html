
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Filmes</title>
    <style>
        :root {
            --bg-color: #0f1014;
            --surface-color: #1a1c23;
            --primary-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        h1 { text-align: center; margin-bottom: 2rem; }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .filter-label {
            background-color: var(--surface-color);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .filter-label:has(input:checked) {
            background-color: var(--primary-color);
            color: white;
            border-color: #60a5fa;
            transform: scale(1.05);
        }

        .filter-label input { display: none; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .movie-card:hover { transform: translateY(-5px); }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background-color: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .movie-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .movie-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .movie-genres {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .movie-rating {
            font-weight: 600;
            color: #fbbf24; /* Amarelo para avaliação */
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        #status-message { text-align: center; color: var(--text-muted); font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>Recomendações de Filmes</h1>
    
    <div id="status-message">Carregando base de dados...</div>
    <div id="filters" class="filters-container"></div>
    <div id="movies-grid" class="movies-grid"></div>

    <script>
        let moviesDatabase = [];
        const filtersContainer = document.getElementById('filters');
        const moviesGrid = document.getElementById('movies-grid');
        const statusMessage = document.getElementById('status-message');

        // Limite de renderização para manter o carregamento rápido no DOM
        const RENDER_LIMIT = 100; 

        async function init() {
            try {
                const response = await fetch('data/movies.json');
                console.log(response);
                if (!response.ok) throw new Error('Erro na requisição');
                
                moviesDatabase = await response.json();

                console.log(moviesDatabase);
console.log(moviesDatabase.length);
                
                statusMessage.style.display = 'none';
                generateFilters();
                renderMovies(moviesDatabase);
            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Erro ao carregar movies.json. Lembre-se de rodar este arquivo usando um servidor local (Live Server, http-server, etc) devido à política de CORS do navegador.";
            }
        }

        function generateFilters() {
            const uniqueGenres = new Set();
            
            moviesDatabase.forEach(movie => {
                if (Array.isArray(movie.genres)) {
                    movie.genres.forEach(genre => uniqueGenres.add(genre));
                }
            });

            // Ordena alfabeticamente e cria os elementos HTML
            Array.from(uniqueGenres).sort().forEach(genre => {
                const label = document.createElement('label');
                label.className = 'filter-label';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = genre;
                checkbox.addEventListener('change', handleFilterChange);
                
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(genre));
                filtersContainer.appendChild(label);
            });
        }

        function handleFilterChange() {
            const checkedBoxes = Array.from(document.querySelectorAll('.filter-label input:checked'));
            const selectedGenres = checkedBoxes.map(cb => cb.value);

            // Se nada estiver selecionado, reseta a lista
            if (selectedGenres.length === 0) {
                renderMovies(moviesDatabase);
                return;
            }

            // Filtro AND: O filme precisa ter TODOS os gêneros selecionados
            const filteredMovies = moviesDatabase.filter(movie => {
                if (!Array.isArray(movie.genres)) return false;
                
                return selectedGenres.every(selectedGenre => 
                    movie.genres.includes(selectedGenre)
                );
            });

            renderMovies(filteredMovies);
        }

        function renderMovies(movies) {
            moviesGrid.innerHTML = '';

            if (movies.length === 0) {
                moviesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Nenhum filme encontrado com essa combinação exata de gêneros.</p>';
                return;
            }

            // Aplica o limite para evitar travamento do navegador com datasets muito grandes
            const moviesToRender = movies.slice(0, RENDER_LIMIT);

            moviesToRender.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';

                // Trata filmes que não possuem URL de imagem
                const posterElement = movie.poster 
                    ? `<img class="movie-poster" src="${movie.poster}" alt="Capa de ${movie.title}" loading="lazy">`
                    : `<div class="movie-poster">Sem Imagem</div>`;

                // Garante que gêneros ausentes não quebrem o split/join
                const genresText = Array.isArray(movie.genres) ? movie.genres.join(', ') : 'Desconhecido';
                
                // Formata popularidade/avaliação, caindo para 0 caso não exista
                const rating = movie.popularity ? movie.popularity.toFixed(1) : '0.0';

                card.innerHTML = `
                    ${posterElement}
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-genres">${genresText}</div>
                        <div class="movie-rating">
                            ★ ${rating}
                        </div>
                    </div>
                `;
                
                moviesGrid.appendChild(card);
            });
        }

        // Inicia a aplicação
        init();
    </script>
</body>
</html>
