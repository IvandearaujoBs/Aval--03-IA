<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Filmes | Explore seu Próximo Favorito</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1a1c23;
            --surface-hover: #242731;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #fbbf24;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 4rem;
        }

        header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 3rem 1rem;
            text-align: center;
        }

        h1 { 
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Search Section */
        .search-container {
            max-width: 600px;
            margin: -1.5rem auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            padding-left: 3rem;
            background-color: var(--surface-color);
            border: 2px solid transparent;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--surface-hover);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Filters */
        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .filter-label {
            background-color: var(--surface-color);
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .filter-label:hover {
            background-color: var(--surface-hover);
            color: var(--text-main);
        }

        .filter-label:has(input:checked) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .filter-label input { display: none; }

        /* Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .movie-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }

        .movie-card:hover { 
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .movie-poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #2d3748;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .movie-no-poster {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #1e293b, #334155);
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .movie-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .movie-title {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em;
        }

        .movie-genres {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .movie-rating {
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.9rem;
        }

        #status-message { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 1.1rem;
            padding: 4rem 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 640px) {
            h1 { font-size: 1.8rem; }
            body { padding: 1rem; }
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
            .movie-info { padding: 0.75rem; }
            .movie-title { font-size: 0.9rem; height: 2.6em; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>CineExplore</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sua biblioteca pessoal de cinema</p>
        </div>
    </header>

    <main class="container">
        <div class="search-container">
            <span class="search-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="search-input" class="search-input" placeholder="Pesquisar filmes pelo título...">
        </div>

        <div id="status-message">Carregando base de dados...</div>
        <div id="filters" class="filters-container"></div>
        <div id="movies-grid" class="movies-grid"></div>
    </main>

    <script>
        let moviesDatabase = [];
        const filtersContainer = document.getElementById('filters');
        const moviesGrid = document.getElementById('movies-grid');
        const statusMessage = document.getElementById('status-message');
        const searchInput = document.getElementById('search-input');

        const RENDER_LIMIT = 100; 

        async function init() {
            try {
                // Tentando carregar o arquivo local
                const response = await fetch('data/movies.json');
                if (!response.ok) throw new Error('Erro na requisição');
                
                moviesDatabase = await response.json();
                
                statusMessage.style.display = 'none';
                generateFilters();
                renderMovies(moviesDatabase);

                // Evento de pesquisa
                searchInput.addEventListener('input', handleFilterChange);
            } catch (error) {
                console.error(error);
                statusMessage.innerHTML = `
                    <div style="max-width: 500px; margin: 0 auto; line-height: 1.6;">
                        <p style="color: #ef4444; margin-bottom: 1rem;">⚠️ Erro ao carregar movies.json</p>
                        <p style="font-size: 0.9rem;">Certifique-se de que o arquivo <strong>data/movies.json</strong> existe e que você está rodando o projeto em um servidor local (CORS policy).</p>
                    </div>
                `;
            }
        }

        function generateFilters() {
            const uniqueGenres = new Set();
            
            moviesDatabase.forEach(movie => {
                if (Array.isArray(movie.genres)) {
                    movie.genres.forEach(genre => uniqueGenres.add(genre));
                }
            });

            Array.from(uniqueGenres).sort().forEach(genre => {
                const label = document.createElement('label');
                label.className = 'filter-label';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = genre;
                checkbox.addEventListener('change', handleFilterChange);
                
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(genre));
                filtersContainer.appendChild(label);
            });
        }

        function handleFilterChange() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const checkedBoxes = Array.from(document.querySelectorAll('.filter-label input:checked'));
            const selectedGenres = checkedBoxes.map(cb => cb.value);

            const filteredMovies = moviesDatabase.filter(movie => {
                // Filtro por Nome (Busca)
                const matchesSearch = movie.title.toLowerCase().includes(searchTerm);
                
                // Filtro por Gênero (AND logic)
                let matchesGenres = true;
                if (selectedGenres.length > 0) {
                    if (!Array.isArray(movie.genres)) {
                        matchesGenres = false;
                    } else {
                        matchesGenres = selectedGenres.every(selectedGenre => 
                            movie.genres.includes(selectedGenre)
                        );
                    }
                }

                return matchesSearch && matchesGenres;
            });

            renderMovies(filteredMovies);
        }

        function renderMovies(movies) {
            moviesGrid.innerHTML = '';

            if (movies.length === 0) {
                moviesGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem 0;">
                        <p style="color: var(--text-muted); font-size: 1.2rem;">Nenhum filme encontrado.</p>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Tente ajustar seus filtros ou termo de busca.</p>
                    </div>
                `;
                return;
            }

            const moviesToRender = movies.slice(0, RENDER_LIMIT);

            moviesToRender.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';

                const posterHtml = movie.poster 
                    ? `<img class="movie-poster" src="${movie.poster}" alt="Capa de ${movie.title}" loading="lazy">`
                    : `<div class="movie-no-poster">Sem Imagem</div>`;

                const genresText = Array.isArray(movie.genres) ? movie.genres.join(', ') : 'Desconhecido';
                const rating = movie.popularity ? movie.popularity.toFixed(1) : '0.0';

                card.innerHTML = `
                    <div class="movie-poster-container">
                        ${posterHtml}
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title" title="${movie.title}">${movie.title}</h3>
                        <div class="movie-genres">${genresText}</div>
                        <div class="movie-footer">
                            <div class="movie-rating">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent-color)"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                ${rating}
                            </div>
                        </div>
                    </div>
                `;
                
                moviesGrid.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
